<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Inteligente de Recebimento</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
}
.container{
    background:white;
    padding:20px;
    border-radius:8px;
}
input{
    padding:8px;
    width:300px;
    margin-bottom:10px;
}
button{
    padding:10px;
    background:#0078D4;
    color:white;
    border:none;
}
#resultado{
    margin-top:20px;
    border:1px solid #ccc;
    padding:15px;
}
</style>
</head>
<body>

<div class="container">

<h2>Painel Inteligente de Recebimento</h2>

<p>Pedido SAP</p>
<input id="pedidoSAP">

<p>Fornecedor</p>
<input id="fornecedor">

<p>Upload XML</p>
<input type="file" id="xmlFile" accept=".xml">

<br><br>

<button onclick="validar()">Validar</button>

<div id="resultado"></div>

</div>

<script>

document.getElementById("xmlFile").addEventListener("change", carregarXML);

let dadosXML = {};

function carregarXML(event){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const parser = new DOMParser();

const xml =
parser.parseFromString(
e.target.result,
"text/xml"
);

function buscar(tag){
    const elemento =
    xml.getElementsByTagName(tag)[0];

    return elemento ?
        elemento.textContent :
        "";
}

dadosXML = {
    chave: buscar("chNFe"),
    numeroNF: buscar("nNF"),
    cnpj: buscar("CNPJ"),
    ie: buscar("IE"),
    placa: buscar("placa"),
    peso: buscar("pesoL"),
    valorNF: buscar("vNF"),
    valorUnitario: buscar("vUnCom")
};

alert("XML carregado com sucesso");

};

reader.readAsText(file);

}

function validar(){

let html = "";

html += "<h3>Dados XML</h3>";

html += "Chave: " + (dadosXML.chave || "") + "<br>";
html += "NF: " + (dadosXML.numeroNF || "") + "<br>";
html += "CNPJ: " + (dadosXML.cnpj || "") + "<br>";
html += "IE: " + (dadosXML.ie || "") + "<br>";
html += "Placa: " + (dadosXML.placa || "") + "<br>";
html += "Peso: " + (dadosXML.peso || "") + "<br>";
html += "Valor NF: " + (dadosXML.valorNF || "") + "<br>";

document.getElementById("resultado").innerHTML = html;

}

</script>

</body>
</html>
